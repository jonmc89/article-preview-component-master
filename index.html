<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <title>Frontend Mentor | Article preview component</title>
  </head>
  <body>
    <main>
      <article class="card">
        <div class="image-container">
          <img
            src="./images/drawers.jpg"
            alt="a set of green drawers with a brown vase with dryed flowers inside with a couple of white picture frames on top of the drawers against a white brick wall."
          />
        </div>
        <div class="text-container">
          <div class="text-wrapper">
            <p class="text-bold">
              Shift the overall look and feel by adding these wonderful touches
              to furniture in your home
            </p>
            <p class="text-medium">
              Ever been in a room and felt like something was missing? Perhaps
              it felt slightly bare and uninviting. I’ve got some simple tips to
              help you make any room feel complete.
            </p>
            <div class="profile-container">
              <img
                src="./images/avatar-michelle.jpg"
                alt="a young woman with brown long hair wearing a white jumper and a green jacket against a white blank background"
              />
              <div class="profile-text-wrapper">
                <p class="name">Michelle Appleton</p>
                <p class="date">28 Jun 2020</p>
              </div>
              <button><img src="./images/icon-share.svg" alt="" /></button>
            </div>
          </div>
        </div>
      </article>
    </main>
  </body>
</html>
